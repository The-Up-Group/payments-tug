openapi: 3.0.0
info:
  title: payments-tug API
  version: 1.0.0

servers:
  - url: https://payments.theupgroup.com.mx

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        detail:
          type: string
          description: Only present in non-production environments
    PlatformPayout:
      type: object
      properties:
        id:
          type: string
          example: po_123
        amount:
          type: integer
          example: 1000000
        currency:
          type: string
          example: mxn
        arrivalDate:
          type: integer
          description: Unix timestamp (seconds) when the funds are expected in the bank
        created:
          type: integer
          description: Unix timestamp (seconds) when the payout was created
        status:
          type: string
          enum: [pending, in_transit, paid, failed, canceled]
        description:
          type: string
          nullable: true
    WebhookForwardPayload:
      type: object
      description: Body that `POST /webhooks/stripe` forwards to the payment-webhook edge function (`WEBHOOK_FORWARD_URL`), authenticated with header `x-webhook-secret`. All amounts are integer cents.
      required: [type, paymentIntentId, metadata]
      properties:
        type:
          type: string
          enum: [payment_intent.succeeded, payment_intent.payment_failed]
        paymentIntentId:
          type: string
          example: pi_123
        amount:
          type: integer
          description: Only on `payment_intent.succeeded`
          example: 108500
        currency:
          type: string
          description: Only on `payment_intent.succeeded`
          example: mxn
        applicationFeeAmount:
          type: integer
          description: SPOT commission. `intent.application_fee_amount` on Connect charges, `metadata.applicationFeeAmount` on platform charges. Omitted if neither is valid. Stored in `payments.platform_fee`.
          example: 8500
        stripeFee:
          type: integer
          description: Stripe processing fee (`balance_transaction.fee`). Omitted if it could not be read. Stored in `payments.stripe_fee`.
          example: 4100
        transferAmount:
          type: integer
          description: Amount transferred to the organizer (`charge.transfer.amount`) on Connect charges, `0` on platform charges. Omitted if it could not be read or the transfer is not available yet. Stored in `payments.transfer_amount`.
          example: 100000
        balanceTransactionId:
          type: string
          description: Stripe balance transaction id. Stored in `payments.stripe_balance_transaction_id`.
          example: txn_123
        metadata:
          type: object
          description: The PaymentIntent metadata as sent by createPayment / createCheckoutSession
          additionalProperties:
            type: string

paths:
  /health:
    get:
      summary: Health Check
      security: []
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /payments:
    post:
      summary: Create a payment intent
      description: |
        Creates a Stripe PaymentIntent. If paymentMethodId is provided the intent is confirmed immediately.

        - **With destinationAccountId (Connect / destination charge):** Stripe transfers `amount - applicationFeeAmount` to the organizer's Connect account and keeps `applicationFeeAmount` for the platform.
        - **Without destinationAccountId (platform charge):** the full amount stays in the platform account. `transfer_data` and `application_fee_amount` are NOT sent to Stripe (Stripe rejects a fee without a destination). The metadata gets `platformCharge: "true"`.

        In both cases `applicationFeeAmount` is required, validated, and copied to `metadata.applicationFeeAmount` (string) so the webhook can report it for platform charges.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
                - currency
                - customerId
                - applicationFeeAmount
                - appId
                - eventId
                - userId
                - ticketTypeId
                - quantity
              properties:
                amount:
                  type: integer
                  description: Total in cents
                  example: 50000
                currency:
                  type: string
                  example: mxn
                customerId:
                  type: string
                  example: cus_xxx
                destinationAccountId:
                  type: string
                  description: Optional. Stripe Connect account ID of the organizer. Omit it to create a platform charge (e.g. events owned by the platform organizer).
                  example: acct_xxx
                applicationFeeAmount:
                  type: integer
                  description: Platform fee in cents, computed by the client from the event's commission rate. Required for both Connect and platform charges. Must be >= 0 and <= amount. Only sent to Stripe as application_fee_amount when destinationAccountId is present.
                  example: 5000
                appId:
                  type: string
                  example: spot
                eventId:
                  type: string
                  example: uuid
                userId:
                  type: string
                  description: Supabase user id of the buyer, stored in the PaymentIntent metadata so the payment-webhook edge function can create the event_bookings row(s)
                  example: uuid
                ticketTypeId:
                  type: string
                  description: event_ticket_types id being purchased, stored in the PaymentIntent metadata
                  example: uuid
                quantity:
                  type: integer
                  description: Number of tickets being purchased. Must be >= 1.
                  example: 1
                paymentMethodId:
                  type: string
                  description: If provided, intent is confirmed immediately (saved card flow)
                  example: pm_xxx
      responses:
        '201':
          description: Payment intent created
          content:
            application/json:
              schema:
                type: object
                properties:
                  clientSecret:
                    type: string
                    description: null when paymentMethodId was provided
                  paymentIntentId:
                    type: string
                  platformFee:
                    type: integer
                    description: Platform fee in cents, echoed back from applicationFeeAmount
                    example: 5000
        '400':
          description: Missing required fields, or applicationFeeAmount is missing/negative/greater than amount
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to create payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /payments/{id}:
    get:
      summary: Get payment status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: pi_xxx
      responses:
        '200':
          description: Payment status retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  status:
                    type: string
                    example: succeeded
                  amount:
                    type: integer
                    example: 50000
                  currency:
                    type: string
                    example: mxn
        '500':
          description: Failed to retrieve payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /payments/checkout-sessions:
    post:
      summary: Create an embedded Checkout Session
      description: |
        Web-only. Creates a Stripe Checkout Session (ui_mode `embedded_page`) for mounting inline in Flutter web via Stripe.js embedded checkout. The client_secret returned here is a Checkout Session client secret, distinct from the PaymentIntent client secret used by POST /payments.

        Same Connect / platform rules as POST /payments: with destinationAccountId it is a destination charge; without it, `payment_intent_data` carries no `transfer_data` / `application_fee_amount` and the full amount stays in the platform account. The same metadata (including `applicationFeeAmount` and, for platform charges, `platformCharge: "true"`) is set on both the PaymentIntent and the Checkout Session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
                - currency
                - customerId
                - applicationFeeAmount
                - appId
                - eventId
                - userId
                - ticketTypeId
                - quantity
                - returnUrl
              properties:
                amount:
                  type: integer
                  description: Total in cents
                  example: 50000
                currency:
                  type: string
                  example: mxn
                customerId:
                  type: string
                  example: cus_xxx
                destinationAccountId:
                  type: string
                  description: Optional. Stripe Connect account ID of the organizer. Omit it to create a platform charge (e.g. events owned by the platform organizer).
                  example: acct_xxx
                applicationFeeAmount:
                  type: integer
                  description: Platform fee in cents, computed by the client from the event's commission rate. Required for both Connect and platform charges. Must be >= 0 and <= amount. Only sent to Stripe as application_fee_amount when destinationAccountId is present.
                  example: 5000
                appId:
                  type: string
                  example: spot
                eventId:
                  type: string
                  example: uuid
                userId:
                  type: string
                  description: Supabase user id of the buyer, stored in the Checkout Session and PaymentIntent metadata so the payment-webhook edge function can create the event_bookings row(s)
                  example: uuid
                ticketTypeId:
                  type: string
                  description: event_ticket_types id being purchased, stored in the Checkout Session and PaymentIntent metadata
                  example: uuid
                quantity:
                  type: integer
                  description: Number of tickets being purchased. Must be >= 1.
                  example: 1
                returnUrl:
                  type: string
                  description: URL Stripe redirects to for payment methods that require an off-page redirect step (e.g. some 3DS flows), even though the main flow stays embedded
                  example: https://app.spot.mx/checkout/return
      responses:
        '201':
          description: Checkout session created
          content:
            application/json:
              schema:
                type: object
                properties:
                  clientSecret:
                    type: string
                    description: Checkout Session client secret, used to initialize Stripe.js embedded checkout. Distinct from a PaymentIntent client secret.
                  sessionId:
                    type: string
                    example: cs_xxx
                  paymentIntentId:
                    type: string
                    nullable: true
                    description: Almost always null at this point — Stripe does not create the underlying PaymentIntent until the buyer starts completing the Checkout Session. Poll GET /payments/checkout-sessions/{sessionId} after the embedded checkout reports completion to get the resolved id.
                    example: null
                  platformFee:
                    type: integer
                    description: Platform fee in cents, echoed back from applicationFeeAmount
                    example: 5000
        '400':
          description: Missing required fields, or applicationFeeAmount is missing/negative/greater than amount
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to create checkout session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /payments/checkout-sessions/{sessionId}:
    get:
      summary: Get the status and resolved paymentIntentId of a Checkout Session
      description: Web-only. Stripe only creates the PaymentIntent underneath a Checkout Session once the buyer starts completing payment, so POST /payments/checkout-sessions returns paymentIntentId as null. The client calls this endpoint after the embedded checkout's onComplete fires, to fetch the now-resolved paymentIntentId before inserting the `payments` row.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
          example: cs_xxx
      responses:
        '200':
          description: Checkout session status
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessionId:
                    type: string
                    example: cs_xxx
                  status:
                    type: string
                    description: Stripe Checkout Session status
                    example: complete
                  paymentIntentId:
                    type: string
                    nullable: true
                    example: pi_xxx
        '500':
          description: Failed to retrieve checkout session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /payments/customers:
    post:
      summary: Create or get Stripe customer
      description: Finds an existing Stripe customer by userId + appId metadata, or creates a new one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - appId
              properties:
                appId:
                  type: string
                  example: spot
      responses:
        '200':
          description: Existing customer found
          content:
            application/json:
              schema:
                type: object
                properties:
                  customerId:
                    type: string
                    example: cus_xxx
                  isNew:
                    type: boolean
                    example: false
        '201':
          description: New customer created
          content:
            application/json:
              schema:
                type: object
                properties:
                  customerId:
                    type: string
                    example: cus_xxx
                  isNew:
                    type: boolean
                    example: true
        '400':
          description: appId is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to create or retrieve customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /payments/customers/session:
    post:
      summary: Create a customer session
      description: Creates a short-lived Stripe CustomerSession. Pass the returned clientSecret to Stripe.js Payment Element to display and manage saved cards.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - customerId
              properties:
                customerId:
                  type: string
                  example: cus_xxx
      responses:
        '201':
          description: Customer session created
          content:
            application/json:
              schema:
                type: object
                properties:
                  clientSecret:
                    type: string
                    example: cuss_xxx_secret_xxx
        '400':
          description: customerId is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to create customer session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /payments/customers/{customerId}/payment-methods:
    get:
      summary: List saved payment methods
      description: Returns all saved cards for a Stripe customer.
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: string
          example: cus_xxx
      responses:
        '200':
          description: Payment methods retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  paymentMethods:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: pm_xxx
                        cardBrand:
                          type: string
                          example: visa
                        last4:
                          type: string
                          example: '4242'
                        expMonth:
                          type: integer
                          example: 12
                        expYear:
                          type: integer
                          example: 2027
        '400':
          description: customerId is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to retrieve payment methods
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /payments/payment-methods/{pmId}:
    delete:
      summary: Delete a saved payment method
      parameters:
        - name: pmId
          in: path
          required: true
          schema:
            type: string
          example: pm_xxx
      responses:
        '200':
          description: Payment method deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          description: pmId is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to delete payment method
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /payments/setup-intents:
    post:
      summary: Create a setup intent
      description: Creates a Stripe SetupIntent to save a card without charging. Flutter uses the clientSecret with CardField to confirm.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - customerId
                - appId
              properties:
                customerId:
                  type: string
                  example: cus_xxx
                appId:
                  type: string
                  example: spot
      responses:
        '201':
          description: SetupIntent created
          content:
            application/json:
              schema:
                type: object
                properties:
                  clientSecret:
                    type: string
                    example: seti_xxx_secret_xxx
        '400':
          description: customerId and appId are required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to create setup intent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /payments/accounts/onboard:
    post:
      summary: Onboard organizer — create Stripe Connect account
      description: Creates a Stripe Connect account for the organizer and returns a KYC URL to open in the browser.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - appId
                - email
                - refreshUrl
                - returnUrl
              properties:
                appId:
                  type: string
                  example: spot
                email:
                  type: string
                  example: organizer@email.com
                refreshUrl:
                  type: string
                  description: Stripe redirects here if the onboarding link expires
                  example: https://yourapp.com/organizer/refresh
                returnUrl:
                  type: string
                  description: Stripe redirects here after KYC is completed
                  example: https://yourapp.com/organizer/return
      responses:
        '201':
          description: Organizer account created
          content:
            application/json:
              schema:
                type: object
                properties:
                  accountId:
                    type: string
                    example: acct_xxx
                  onboardingUrl:
                    type: string
                    example: https://connect.stripe.com/setup/e/...
        '400':
          description: Missing required fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to create organizer account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /payments/accounts/{accountId}/status:
    get:
      summary: Get organizer account status
      description: Returns whether the organizer has completed KYC and can receive charges.
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
          example: acct_xxx
      responses:
        '200':
          description: Account status retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  accountId:
                    type: string
                    example: acct_xxx
                  chargesEnabled:
                    type: boolean
                    example: true
                  detailsSubmitted:
                    type: boolean
                    example: true
        '500':
          description: Failed to retrieve account status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /payments/accounts/{accountId}/link:
    post:
      summary: Create a new organizer onboarding link
      description: Generates a fresh Stripe Connect onboarding (KYC) link for an existing account, used when the organizer left onboarding mid-way and wants to resume.
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
          example: acct_xxx
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshUrl
                - returnUrl
              properties:
                refreshUrl:
                  type: string
                  description: Stripe redirects here if the onboarding link expires
                  example: https://yourapp.com/organizer/refresh
                returnUrl:
                  type: string
                  description: Stripe redirects here after KYC is completed
                  example: https://yourapp.com/organizer/return
      responses:
        '200':
          description: Onboarding link created
          content:
            application/json:
              schema:
                type: object
                properties:
                  onboardingUrl:
                    type: string
                    example: https://connect.stripe.com/setup/e/...
        '400':
          description: Missing required fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to create account link
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /payments/accounts/{accountId}/balance:
    get:
      summary: Get organizer balance
      description: Returns the connected account's Stripe balance. `available` can be paid out now; `pending` is still in Stripe's holding period and will move to `available` automatically.
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
          example: acct_xxx
      responses:
        '200':
          description: Balance retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  available:
                    type: integer
                    description: Amount in cents available for payout now
                    example: 1245000
                  pending:
                    type: integer
                    description: Amount in cents still in Stripe's holding period
                    example: 50000
                  currency:
                    type: string
                    example: mxn
        '500':
          description: Failed to retrieve organizer balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /payments/accounts/{accountId}/payouts:
    get:
      summary: Get organizer payouts
      description: Returns the connected account's 10 most recent Stripe payouts.
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
          example: acct_xxx
      responses:
        '200':
          description: Payouts retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  payouts:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: po_xxx
                        amount:
                          type: integer
                          example: 50000
                        currency:
                          type: string
                          example: mxn
                        arrivalDate:
                          type: integer
                          description: Unix timestamp (seconds)
                          example: 1735689600
                        status:
                          type: string
                          example: in_transit
                        description:
                          type: string
                          nullable: true
        '500':
          description: Failed to retrieve organizer payouts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /payments/accounts/{accountId}/charges:
    get:
      summary: Get organizer charges summary for the current month
      description: Aggregates the connected account's Stripe charges since the start of the current calendar month (paid, non-refunded only).
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
          example: acct_xxx
      responses:
        '200':
          description: Charges summary retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  monthlyTotal:
                    type: integer
                    description: Sum of charge amounts this month, in cents
                    example: 1500000
                  currency:
                    type: string
                    example: mxn
                  ticketsSold:
                    type: integer
                    description: Number of paid, non-refunded charges this month
                    example: 30
                  spotCommission:
                    type: integer
                    description: Sum of application_fee_amount across this month's charges, in cents
                    example: 150000
        '500':
          description: Failed to retrieve organizer charges
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /payments/accounts/{accountId}:
    delete:
      summary: Delete organizer account
      description: Permanently deletes a Stripe Connect account. Required for Apple App Store compliance.
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
          example: acct_xxx
      responses:
        '200':
          description: Account deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          description: accountId is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to delete organizer account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /payments/platform/balance:
    get:
      summary: Get platform (SPOT) balance — admin only
      description: |
        Balance of the main Stripe account (no `stripeAccount` header). Requires a user JWT **and** `profiles.role = 'admin'`: after verifying the JWT, `AdminMiddleware` calls Supabase `rpc/is_admin` with that same token (needs `SUPABASE_URL` and `SUPABASE_ANON_KEY`).

        The balance belongs to the whole Stripe account; it cannot be split by `appId`.
      parameters:
        - name: currency
          in: query
          required: false
          schema:
            type: string
            default: mxn
      responses:
        '200':
          description: Balance retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  available:
                    type: integer
                    description: Cents that can be paid out now
                    example: 1245000
                  pending:
                    type: integer
                    description: Cents still in Stripe's holding period
                    example: 50000
                  currency:
                    type: string
                    example: mxn
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The user is not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to retrieve platform balance, or admin check not configured / unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /payments/platform/payouts:
    get:
      summary: List platform payouts — admin only
      description: Most recent payouts from the main Stripe account to its bank account. Same admin requirement as `/payments/platform/balance`.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Payouts retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  payouts:
                    type: array
                    items:
                      $ref: '#/components/schemas/PlatformPayout'
        '401':
          description: Missing or invalid JWT
        '403':
          description: The user is not an admin
        '500':
          description: Failed to retrieve platform payouts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create a manual platform payout — admin only
      description: |
        Sends `amount` from the available balance of the main Stripe account to its registered bank account (`stripe.payouts.create`). Same admin requirement as `/payments/platform/balance`.

        - `amount` must be a positive integer (cents) and not exceed the available balance in `currency`.
        - `requestId` is generated by the client once per confirmation and used as the Stripe idempotency key (`platform-payout-<requestId>`), so a double tap or retry does not create two payouts.
        - The admin's user id is stored in `metadata.triggeredBy`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, requestId]
              properties:
                amount:
                  type: integer
                  example: 1000000
                currency:
                  type: string
                  default: mxn
                requestId:
                  type: string
                  example: 6f1c2a9e-5d1b-4f7a-9c0e-2b8d4e3a1f00
      responses:
        '201':
          description: Payout created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformPayout'
        '400':
          description: Invalid amount/requestId, amount exceeds the available balance (`available` included in the body), or Stripe rejected the payout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid JWT
        '403':
          description: The user is not an admin
        '500':
          description: Failed to create platform payout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /webhooks/stripe:
    post:
      summary: Stripe webhook receiver
      description: |
        Receives events from Stripe. Verifies signature and forwards to SPOT backend. Must NOT include Authorization header.

        For `payment_intent.succeeded` the forwarded `applicationFeeAmount` is `intent.application_fee_amount` (fee Stripe retained on Connect charges); when that is null (platform charges) it falls back to `Number(intent.metadata.applicationFeeAmount)`. If neither is a valid number the field is omitted.

        For `payment_intent.succeeded` the handler also retrieves the PaymentIntent with `expand: ['latest_charge.balance_transaction', 'latest_charge.transfer']` and adds to the forwarded payload (stored by payment-webhook in `payments.stripe_fee`, `payments.transfer_amount`, `payments.stripe_balance_transaction_id`):
        - `stripeFee`: `balance_transaction.fee`, the processing fee Stripe charged SPOT (integer cents).
        - `balanceTransactionId`: `balance_transaction.id`.
        - `transferAmount`: `charge.transfer.amount` on Connect charges (amount sent to the organizer); `0` on platform charges (no `transfer_data`). Omitted on a Connect charge whose transfer is not available yet.

        This lookup is best-effort: if Stripe fails, the error is logged and the payment is still forwarded without these fields (bookings are never blocked by it).

        The forwarded body (POST to `WEBHOOK_FORWARD_URL` with header `x-webhook-secret`) is documented in the `WebhookForwardPayload` schema.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  example: payment_intent.succeeded
                data:
                  type: object
      responses:
        '200':
          description: Event received
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean
                    example: true
        '400':
          description: Webhook signature verification failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Forwarding to payment-webhook failed (missing `PAYMENT_WEBHOOK_SECRET` or non-2xx from the edge function); Stripe retries the event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
